# hyprsunset — clock-based blue-light filter profiles for Rome (Europe/Rome).
#
# Syntax requires hyprlang >= 0.6 (Hyprland 0.56+): special categories use
# the `profile[key] { ... }` form. `time` values must NOT be quoted.
# Each profile stays active from its `time` until the next profile's `time`;
# before the first profile the last one wraps around (overnight = night).
#
# Rome (41.9N) reference: sunrise 05:30 (Jun) - 07:25 (Dec);
#                          sunset  20:45 (Jun) - 16:30 (Dec).

max-gamma = 100

# Morning / daytime: neutral, closest to unfiltered daylight.
profile[day] {
    time = 06:30
    temperature = 6500
    gamma = 1.0
    identity = 0
}

# Evening: gentle warm tint (kicks in ~3h before summer sunset, ~sunset in winter).
profile[evening] {
    time = 17:30
    temperature = 4500
    gamma = 1.0
    identity = 0
}

# Night: full warm filter, active through the whole night until 06:30.
profile[night] {
    time = 21:00
    temperature = 3500
    gamma = 1.0
    identity = 0
}
